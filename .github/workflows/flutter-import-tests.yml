name: Flutter Import Tests

on:
  push:
    branches:
      - phase8-data-migration
  pull_request:
    branches:
      - phase8-data-migration
  workflow_dispatch:

jobs:
  import-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run import validation and workbook tests
        run: flutter test test/import_validation_test.dart

      - name: Analyze Flutter project
        run: flutter analyze
