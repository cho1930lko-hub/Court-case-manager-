name: Android SQLCipher Migration Integration

on:
  push:
    branches:
      - phase8-data-migration
  pull_request:
    branches:
      - phase8-data-migration
  workflow_dispatch:

jobs:
  sqlcipher-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform project
        run: flutter create --platforms=android --org in.gov.courtcases --project-name court_case_manager .

      - name: Run Android SQLCipher v4 to v5 migration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 2048 -cores 2
          working-directory: mobile_app
          script: flutter test integration_test/sqlcipher_migration_test.dart -d emulator-5554
