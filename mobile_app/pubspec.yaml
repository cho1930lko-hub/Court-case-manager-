name: court_case_manager
description: Offline-first Android Court Case Manager with local SQLite storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite_sqlcipher: ^3.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  excel: ^4.0.6
  pdf: ^3.11.2
  printing: ^5.13.4
  archive: ^3.6.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
