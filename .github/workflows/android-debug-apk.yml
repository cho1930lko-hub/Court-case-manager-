name: Android Debug APK

on:
  push:
    branches:
      - phase8-data-migration
    paths:
      - 'mobile_app/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests and static analysis
        run: |
          flutter test
          flutter analyze

      - name: Generate Android platform project
        run: flutter create --platforms=android --org in.gov.courtcases --project-name court_case_manager .

      - name: Configure Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app_candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file not found")
          source = app.read_text()
          updated = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          if updated == source and "compileSdk = 36" not in source and "compileSdkVersion 36" not in source:
              raise SystemExit(f"Could not set compileSdk in {app}")
          app.write_text(updated)

          roots = [Path("android/build.gradle.kts"), Path("android/build.gradle")]
          root = next((p for p in roots if p.exists()), None)
          if root is None:
              raise SystemExit("Android root Gradle file not found")
          root_source = root.read_text()
          if "FORCE_ANDROID_PLUGIN_COMPILE_SDK_36" not in root_source:
              if root.suffix == ".kts":
                  root_source += """
          // FORCE_ANDROID_PLUGIN_COMPILE_SDK_36
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.gradle.AppExtension> {
                      compileSdkVersion(36)
                  }
              }
          }
          """
              else:
                  root_source += """
          // FORCE_ANDROID_PLUGIN_COMPILE_SDK_36
          subprojects {
              plugins.withId('com.android.library') {
                  extensions.getByName('android').compileSdkVersion(36)
              }
              plugins.withId('com.android.application') {
                  extensions.getByName('android').compileSdkVersion(36)
              }
          }
          """
              root.write_text(root_source)
          PY

      - name: Patch file_picker Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list((Path.home() / ".pub-cache").rglob("file_picker-*/android/build.gradle*"))
          if not candidates:
              raise SystemExit("file_picker Android Gradle file not found")
          for gradle_file in candidates:
              lines = gradle_file.read_text().splitlines()
              changed = False
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith("compileSdkVersion "):
                      lines[index] = line[:len(line)-len(line.lstrip())] + "compileSdkVersion 36"
                      changed = True
                  elif stripped.startswith("compileSdk "):
                      lines[index] = line[:len(line)-len(line.lstrip())] + "compileSdk 36"
                      changed = True
              if not changed:
                  raise SystemExit(f"Unsupported compileSdk syntax in {gradle_file}")
              gradle_file.write_text("\n".join(lines) + "\n")
          PY

      - name: Add SQLCipher keep rules
        run: |
          mkdir -p android/app
          printf '%s\n' '-keep class net.sqlcipher.** { *; }' > android/app/proguard-rules.pro

      - name: Harden generated Android project
        run: python3 tool/harden_android.py

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: court-case-manager-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
