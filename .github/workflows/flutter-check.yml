name: Flutter checks

on:
  push:
    branches: [android-offline-v1]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    branches: [android-offline-v1]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/flutter-check.yml'

permissions:
  contents: read

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform project
        run: flutter create --platforms=android --org in.gov.courtcases --project-name court_case_manager .
      - name: Set Android compile SDK 36 for app and plugin modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Generated Android app Gradle file not found")
          source = app.read_text()
          updated = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          if updated == source and "compileSdk = 36" not in source and "compileSdkVersion 36" not in source:
              raise SystemExit(f"Could not update compileSdk in {app}")
          app.write_text(updated)
          print(f"Set {app} compileSdk to 36")

          root_candidates = [Path("android/build.gradle.kts"), Path("android/build.gradle")]
          root = next((p for p in root_candidates if p.exists()), None)
          if root is None:
              raise SystemExit("Generated root Gradle file not found")
          root_source = root.read_text()
          if "FORCE_ANDROID_PLUGIN_COMPILE_SDK_36" not in root_source:
              if root.suffix == ".kts":
                  root_source += """
          // FORCE_ANDROID_PLUGIN_COMPILE_SDK_36
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.gradle.AppExtension> {
                      compileSdkVersion(36)
                  }
              }
          }
          """
              else:
                  root_source += """
          // FORCE_ANDROID_PLUGIN_COMPILE_SDK_36
          subprojects {
              plugins.withId('com.android.library') {
                  extensions.getByName('android').compileSdkVersion(36)
              }
              plugins.withId('com.android.application') {
                  extensions.getByName('android').compileSdkVersion(36)
              }
          }
          """
              root.write_text(root_source)
          print(f"Configured Android subprojects in {root}")
          PY
      - name: Patch Flutter plugin compile SDK declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          patched = []
          for gradle_file in pub_cache.glob("*/android/build.gradle*"):
              source = gradle_file.read_text()
              updated = re.sub(r"(compileSdkVersion\\s+)(?:flutter\\.compileSdkVersion|[0-9]+)", r"\\g<1>36", source)
              updated = re.sub(r"(compileSdk\\s*=\\s*)(?:flutter\\.compileSdkVersion|[0-9]+)", r"\\g<1>36", updated)
              if updated != source:
                  gradle_file.write_text(updated)
                  patched.append(str(gradle_file))
          print("Patched plugin Gradle files:", *patched, sep="\\n")
          file_picker = [p for p in patched if "/file_picker-" in p]
          if not file_picker:
              raise SystemExit("file_picker Android Gradle compileSdk was not patched")
          PY
      - name: Add SQLCipher ProGuard keep rules
        run: |
          mkdir -p android/app
          printf '%s\n' '-keep class net.sqlcipher.** { *; }' >> android/app/proguard-rules.pro
      - name: Harden Android project (no auto-backup, FLAG_SECURE)
        run: python3 tool/harden_android.py
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: court-case-manager-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
