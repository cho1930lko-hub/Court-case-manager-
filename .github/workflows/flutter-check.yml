name: Flutter checks

on:
  push:
    branches: [android-offline-v1]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    branches: [android-offline-v1]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/flutter-check.yml'

permissions:
  contents: read

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform project
        run: flutter create --platforms=android --org in.gov.courtcases --project-name court_case_manager .
      - name: Set Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              if updated != source:
                  path.write_text(updated)
                  print(f"Updated {path} to compileSdk 36")
                  break
          else:
              raise SystemExit("Could not find the generated Android compileSdk declaration")
          PY
      - name: Force compile SDK 36 for Android plugin modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/build.gradle.kts"), Path("android/build.gradle")]
          snippet_kts = """
          // Keep Android plugin modules aligned with the app compile SDK.
          subprojects {
              afterEvaluate {
                  val androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.javaClass.methods
                          .firstOrNull { it.name == "setCompileSdkVersion" && it.parameterCount == 1 }
                          ?.invoke(androidExtension, 36)
                  }
              }
          }
          """
          snippet_groovy = """
          // Keep Android plugin modules aligned with the app compile SDK.
          subprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName('android')
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion 36
                  }
              }
          }
          """
          for path in candidates:
              if path.exists():
                  source = path.read_text()
                  snippet = snippet_kts if path.suffix == ".kts" else snippet_groovy
                  if "Keep Android plugin modules aligned" not in source:
                      path.write_text(source.rstrip() + "\n" + snippet)
                  print(f"Configured plugin compile SDK in {path}")
                  break
          else:
              raise SystemExit("Could not find generated Android root Gradle file")
          PY
      - name: Add SQLCipher ProGuard keep rules
        run: |
          mkdir -p android/app
          printf '%s\n' '-keep class net.sqlcipher.** { *; }' >> android/app/proguard-rules.pro
      - name: Harden Android project (no auto-backup, FLAG_SECURE)
        run: python3 tool/harden_android.py
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: court-case-manager-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
